<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

    <div id="caixa">

        <h1 id="titulo">Conversora de moedas</h1>
    
        <input id="reais" type="text" inputmode="decimal" placeholder="Quantos reais voce tem? (R$)">
    
        <br> <br>
    
        <br> <br>

        <button id="calcular_dolar" onclick="calcular_dolar()">Dolar</button> 
        <button id="calcular_euro" onclick="calcular_euro()">Euro</button>

        <p id="resultado"></p>

    </div>

</body>
</html>
